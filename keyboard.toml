# Documentation: https://rmk.rs/docs/configuration/
[keyboard]
name = "TogKey Pad Wireless"
product_name = "Pad Wireless"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "TogKey"
board = "XIAO BLE"
usb_enable = true


[matrix]
matrix_type = "normal" 
row_pins = ["P1_15", "P1_14"] 
col_pins = ["P0_02", "P0_03", "P0_28"] 

[layout]
rows = 2
cols = 3
# Key 1 | Key 2
# Key 3 | Key 4 | Key 5
map = """
    (0,0)  (0,1)
    (1,0)  (1,1)  (1,2)
"""


[host]
# Disable Vial when using Rynk. Rynk and Vial are mutually exclusive.
vial_enabled = true

# Unlock combination: simultaneous press of specified keys
# Format: [[row, col], [row, col], ...]
unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)

# Start (and stay) unlocked, bypassing the unlock-key combo (default: false).
# A development escape hatch — don't ship it. Renamed from `vial_insecure`,
# which still parses.
insecure = true


[keymap]
# One more layer than is defined below: the keymap references layer 2
# (LT(2, ...), TG(2)), which stays empty until the user fills it in.
layers = 4

[[keymap.layer]] # layer 0
name = "base_layer" #optional name for the layer
keys = """
Macro0     Macro1
Macro2     Macro3         Macro4
"""

[[keymap.layer]] # layer 1
keys = """
_     _
_     _         _
"""


#[behavior.combo]
#timeout = "20ms"
#prior_idle_time = "130ms"  # optional, prevents accidental triggers during fast typing
#combos = [
  # Press J and K keys simultaneously to output Escape key
#  { actions = ["Macro0", "Macro2"], output = "Escape" },
  # Press F and D keys simultaneously to output Tab key, but only valid on layer 0
#  { actions = ["F", "D"], output = "Tab", layer = 0 },
  # Three-key combo, press A, S, and D keys to switch to layer 2
#  { actions = ["A", "S", "D"], output = "TO(2)" }
#]
# Outputs Volume Up
[[behavior.macro.macros]]
operations = [
    { operation = "tap", text = "volu" }
]
# Outputs Volume Down
[[behavior.macro.macros]]
operations = [
    { operation = "tap", text = "vold" }
]
# Outputs Media Previous
[[behavior.macro.macros]]
operations = [
    { operation = "tap", text = "mprv" }
]
# Outputs Media Play
[[behavior.macro.macros]]
operations = [
    { operation = "tap", text = "mply" }
]
# Outputs Media Next
[[behavior.macro.macros]]
operations = [
    { operation = "tap", text = "mnxt" }
]
#[[behavior.combo.combos]]
#actions = ["(0,0)", "(0,0)"]
#output = "OSL(2)"
#
#[[behavior.combo.combos]]
#actions = ["(0,0)", "(0,0)"]
#output = "OSL(2)"
#
#[[behavior.combo.combos]]
#actions = ["(0,0)", "(0,0)"]
#output = "O"
#
#[[behavior.combo.combos]]
#actions = ["(0,0)", "(0,0)"]
#output = "O"


[ble]
# Whether to enable BLE feature
enabled = true
# Optional Battery Level name exposed through GATT. Defaults to "Central".
battery_user_description = "Main"
# nRF52 SAADC pin for reading battery level, you can use a pin number or "vddh"
battery_adc_pin = "vddh"
# Set the BLE tx power; higher means better signal but more power consumption. For nRF52840 the maximum tx power is 8.
# nRF52 only, ignored on other chips
default_tx_power = 4
# Whether to enable 2M PHY, defaults to true. nRF52 only, ignored on other chips
use_2m_phy = true
# Enable or disable passkey entry, defaults to false
passkey_entry = false
# Timeout in seconds for passkey entry, defaults to 120
passkey_entry_timeout = 120


#[display]
#driver = "ssd1306"
#size = "128x32"
#rotation = 0
#renderer = "OledRenderer"
#min_render_interval = 10
#
