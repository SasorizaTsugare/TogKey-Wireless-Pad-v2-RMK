# Documentation: https://rmk.rs/docs/configuration/
[keyboard]
name = "TogKey Pad Wireless"
product_name = "TogKey Pad Wireless"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "TogKey"
board = "XIAO BLE"
usb_enable = true

[matrix]
# Row and col pins are mandatory
row_pins = ["P0_10", "P0_09"]
col_pins = ["P0_00", "P0_01", "P0_02"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
row2col = true

[layout]
rows = 2
cols = 3
# Key 1 | Key 2
# Key 3 | Key 4 | Key 5
map = """
    (0,0)  (0,1)
    (1,0)  (1,1)  (1,2)
"""

[host]
# Unlock combination: simultaneous press of specified keys
# Format: [[row, col], [row, col], ...]
unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)

[keymap]
# One more layer than is defined below: the keymap references layer 2
# (LT(2, ...), TG(2)), which stays empty until the user fills it in.
layers = 4

[[keymap.layer]] # layer 0
keys = """
_     _
_     _         _
"""

[[keymap.layer]] # layer 1
keys = """
_     _
_     _         _
"""
